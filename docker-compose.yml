# Optional: use instead of a locally installed Postgres. Uses port 5433 to avoid clashing with a local server.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-medcord}
      POSTGRES_USER: ${DB_USER:-medcord_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medcord_app} -d ${DB_NAME:-medcord}"]
      interval: 5s
      retries: 10
volumes:
  pgdata:

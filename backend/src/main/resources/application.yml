spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: medcord-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medcord}?socketTimeout=30&tcpKeepAlive=true&prepareThreshold=0
    username: ${DB_USER:medcord_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: 5000
      keepalive-time: 120000
      idle-timeout: 120000
      max-lifetime: 300000
      leak-detection-threshold: 40000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

medcord:
  security:
    jwt-secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
  nexconn:
    app-key: ${NEXCONN_APP_KEY:}
    app-secret: ${NEXCONN_APP_SECRET:}
    api-base-url: ${NEXCONN_API_BASE_URL:}
  ai:
    sarvam-api-key: ${SARVAM_AI_API_KEY:}
    sarvam-base-url: ${SARVAM_API_BASE_URL:https://api.sarvam.ai/v1}
    chat-model: ${SARVAM_CHAT_MODEL:sarvam-105b}

spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: medcord-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medcord}
    username: ${DB_USER:medcord_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

medcord:
  security:
    jwt-secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
  nexconn:
    app-key: ${NEXCONN_APP_KEY:}
    app-secret: ${NEXCONN_APP_SECRET:}
    api-base-url: ${NEXCONN_API_BASE_URL:}
  ai:
    sarvam-api-key: ${SARVAM_AI_API_KEY:}
    sarvam-base-url: ${SARVAM_API_BASE_URL:https://api.sarvam.ai/v1}
    chat-model: ${SARVAM_CHAT_MODEL:sarvam-105b}
